services:
  resonance:
    build: .
    image: resonance
    container_name: resonance
    ports:
      # Port d'entree de votre serveur : tapez http://IP-de-votre-serveur:7000
      - "7000:5000"
    volumes:
      # VOTRE dossier musical. METTEZ LE CHEMIN ABSOLU REEL entre guillemets,
      # par exemple "/home/votre-user/Musique" (pas "~" ni "$HOME" : avec sudo,
      # $HOME devient /root et votre musique devient invisible !). Exemples :
      #   - "/home/votre-user/Musique:/music"
      #   - "/opt/musique:/music"
      - /root/Musique:/music
      # Base de donnees (favoris, playlists, cache paroles) persistante :
      - resonance-data:/data
      # FICHIER COOKIES — a activer SEULEMENT si YouTube bloque votre serveur
      # (message "YouTube a bloque votre serveur"). Trois etapes :
      #   1) connectez-vous a YouTube dans votre navigateur
      #   2) installez l'extension "Get cookies.txt LOCALLY" et exportez cookies.txt
      #   3) placez-le a cote de ce fichier et decommentez les 2 lignes suivantes :
      # - ./cookies.txt:/app/cookies.txt:ro
    environment:
      # YTDLP_COOKIES_FILE: /app/cookies.txt
      FLASK_DEBUG: "0"
      # CODE D'ACCES (jalon 4.7) : decommentez et choisissez votre code si le
      # serveur devient joignable depuis l'exterieur du reseau local. Sans
      # code, toute personne du reseau peut telecharger ou modifier la
      # bibliotheque ; avec code, une page demande le code une fois par
      # navigateur (cookie valable 30 jours).
      # RESONANCE_ACCESS_CODE: votre-code-personnel
    restart: unless-stopped

volumes:
  resonance-data:
